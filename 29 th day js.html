  <h2>Task 2 (three)</h2>

  <button id="dark">DarkMode</button>

  <script>
    const butn1= getElementById("dark");
    butn1.addEventListener("click",function (){   
      document.body.classList.toggle("dark");
    });
  </script>

<h2>Task 2 (four)</h2>
<div class="mouse" style="height: 30px; width: 100px; background-color: rgb(195, 195, 55); text-align: center; padding: 5px;" >
   Hello World</div>

<script>
  const mse = document.querySelector(".mouse");
  mse.addEventListener("mouseenter" , function(){
   mse.style.backgroundColor = "red";
  });

  mse.addEventListener("mouseleave", function (){
    mse.style.backgroundColor = "rgb(195, 195, 55)";
  });
</script>



<h2>Task 2 (five)</h2>
<input type="text" id="inputBox">
<p id="output"></p>

<script>
  const input = document.querySelector("#inputBox");
  const output = document.querySelector("#output");

  input.addEventListener("input", function() {
    output.textContent = input.value;
  });
</script>
